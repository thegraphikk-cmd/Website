document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

       <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Why your own site -->\n  <section data-screen-label=\"Portfolio / Why\" style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(12px,2.4vw,32px)\">\n    <h2 style=\"margin:0 0 28px;max-width:16em;font-weight:500;font-size:clamp(30px,3.8vw,52px);line-height:1.1;letter-spacing:-0.05em\">Why a site of your own <span style=\"color:#9A9890\">beats a profile page<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px\">\n      <div style=\"border-radius:20px;background:#2EB0EC;color:#FFFFFF;padding:24px;min-height:220px;display:flex;flex-direction:column\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px\">01<\u002Fdiv><h3 style=\"margin:auto 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.035em\">Found when people search your name<\u002Fh3><p style=\"margin:0;font-size:15px;color:#EAF6FE\">Name-based SEO, so clients and recruiters land on you first.<\u002Fp><\u002Fdiv>\n      <div style=\"border-radius:20px;background:#ECEBE6;padding:24px;min-height:220px;display:flex;flex-direction:column\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">02<\u002Fdiv><h3 style=\"margin:auto 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.035em\">Your work, presented your way<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">Case studies with context and results, not a feed that buries your best pieces.<\u002Fp><\u002Fdiv>\n      <div style=\"border-radius:20px;background:#ECEBE6;padding:24px;min-height:220px;display:flex;flex-direction:column\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">03<\u002Fdiv><h3 style=\"margin:auto 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.035em\">A professional address<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">yourname.com and you@yourname.com on every email and card.<\u002Fp><\u002Fdiv>\n      <div style=\"border-radius:20px;background:#FFE100;padding:24px;min-height:220px;display:flex;flex-direction:column\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#3A3500\">04<\u002Fdiv><h3 style=\"margin:auto 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.035em\">It stays yours<\u002Fh3><p style=\"margin:0;font-size:15px;color:#3A3500\">No algorithm changes, no account bans. You own the domain and the content.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Examples -->\n  <section data-screen-label=\"Portfolio / Examples\" style=\"border-radius:22px;background:#111;color:#FFFFFF;padding:clamp(48px,6vw,88px) clamp(20px,4vw,56px)\">\n    <div style=\"max-width:1240px;margin:0 auto\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px\">\n        <div>\n          <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#BDBDBD;display:flex;align-items:center;gap:8px\"><span style=\"width:5px;height:5px;background:#FFE100\"><\u002Fspan>Portfolio styles<\u002Fdiv>\n          <h2 style=\"margin:18px 0 0;font-weight:500;font-size:clamp(30px,3.8vw,52px);line-height:1.1;letter-spacing:-0.05em\">Three directions <span style=\"color:#8A8A8A\">we tailor to you<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#1C1C1C\"><image-slot id=\"pf-style-minimal\" src=\"data:image/webp;base64,UklGRtDbAABXRUJQVlA4WAoAAAAgAAAA5wMA4QQASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlk 21px;letter-spacing:-0.03em\">Personal brand<\u002Fh3><p style=\"margin:0;font-size:14px;color:#BDBDBD\">Bold colour, video, media kit and stats. Suits creators, coaches and founders.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Pricing -->\n  <section id=\"pf-pricing\" data-screen-label=\"Portfolio / Pricing\" style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(12px,2.4vw,32px) 0;scroll-margin-top:96px\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px\">\n      <div>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#555;display:flex;align-items:center;gap:8px\"><span style=\"width:5px;height:5px;background:#2EB0EC\"><\u002Fspan>Portfolio packages<\u002Fdiv>\n        <h2 style=\"margin:18px 0 0;font-weight:500;font-size:clamp(30px,3.8vw,52px);line-height:1.1;letter-spacing:-0.05em\">Priced for individuals<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px\">\n      <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"position:relative;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:18px;background:{{ t.bg }};color:{{ t.fg }}\">\n          <sc-if value=\"{{ t.popular }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;right:16px;top:16px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#FFE100;color:#111\">Most chosen<\u002Fspan><\u002Fsc-if>\n          <div><h3 style=\"margin:0;font-weight:500;font-size:22px;letter-spacing:-0.03em\">{{ t.name }}<\u002Fh3><p style=\"margin:4px 0 0;font-size:14px;color:{{ t.sub }}\">{{ t.forWho }}<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ t.sub }}\">Starting at<\u002Fdiv><div style=\"margin-top:4px;font-size:46px;letter-spacing:-0.06em;line-height:1\">{{ t.price }}<\u002Fdiv><div style=\"font-size:13px;margin-top:6px;color:{{ t.sub }}\">{{ t.note }}<\u002Fdiv><\u002Fdiv>\n          <a href=\"Contact.html\" style=\"display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:{{ t.btnBg }};color:{{ t.btnFg }};border:{{ t.btnBorderCss }}\">{{ t.cta }}<\u002Fa>\n          <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px;padding-top:18px;border-top:{{ t.lineCss }}\">\n            <sc-for list=\"{{ t.features }}\" as=\"f\" hint-placeholder-count=\"5\"><span style=\"display:flex;gap:10px\"><span style=\"color:{{ t.tick }}\">✓<\u002Fspan>{{ f }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:16px;border-top:{{ t.lineCss }};font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:{{ t.sub }}\">Delivery · {{ t.time }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;font-size:14px;color:#666;text-align:center\">{{ footnote }}<\u002Fp>\n  <\u002Fsection>\n\n  <!-- Process -->\n  <section data-screen-label=\"Portfolio / Process\" style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(12px,2.4vw,32px)\">\n    <h2 style=\"margin:0 0 28px;font-weight:500;font-size:clamp(30px,3.8vw,52px);line-height:1.1;letter-spacing:-0.05em\">From folder of work <span style=\"color:#9A9890\">to live site<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;border-top:1px solid #DDDCD6\">\n      <div style=\"padding:24px 24px 8px 0;border-right:1px solid #DDDCD6\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">01 · Day 1<\u002Fdiv><h3 style=\"margin:28px 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.03em\">Story call<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">30 minutes on who you are, who you want to reach and what they should do.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 24px 8px;border-right:1px solid #DDDCD6\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">02 · Days 2–4<\u002Fdiv><h3 style=\"margin:28px 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.03em\">Pick your best work<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">Send us everything. We help choose 6–12 pieces and shape each into a short case study.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 24px 8px;border-right:1px solid #DDDCD6\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">03 · Week 1–2<\u002Fdiv><h3 style=\"margin:28px 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.03em\">Design and build<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">A design in your style, then the build on a private link you can share for feedback.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:24px 0 8px 24px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#888\">04 · Launch<\u002Fdiv><h3 style=\"margin:28px 0 8px;font-weight:500;font-size:22px;letter-spacing:-0.03em\">Go live on your name<\u002Fh3><p style=\"margin:0;font-size:15px;color:#555\">Domain, email, Google indexing and a video on how to add new work.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section data-screen-label=\"Portfolio / FAQ\" style=\"max-width:1320px;margin:0 auto;padding:0 clamp(12px,2.4vw,32px) clamp(64px,8vw,112px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(28px,5vw,72px)\">\n      <div>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#555;display:flex;align-items:center;gap:8px\"><span style=\"width:5px;height:5px;background:#111\"><\u002Fspan>FAQ<\u002Fdiv>\n        <h2 style=\"margin:18px 0 0;font-weight:500;font-size:clamp(30px,3.8vw,52px);line-height:1.1;letter-spacing:-0.05em\">Portfolio questions<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <details style=\"border-radius:16px;background:#ECEBE6;padding:0 20px\"><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;font-size:17px;font-weight:500;letter-spacing:-0.02em\">Do I need a portfolio website if I have LinkedIn or Instagram?<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0;padding:0 0 20px;color:#555\">Social profiles are rented space. A portfolio site on your own domain shows up when people search your name, presents your work the way you choose, and stays yours if a platform changes.<\u002Fp><\u002Fdetails>\n        <details style=\"border-radius:16px;background:#ECEBE6;padding:0 20px\"><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;font-size:17px;font-weight:500;letter-spacing:-0.02em\">Can I update the portfolio myself?<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0;padding:0 0 20px;color:#555\">Yes. You get an easy editor for adding projects, posts and photos, plus a short video walkthrough.<\u002Fp><\u002Fdetails>\n        <details style=\"border-radius:16px;background:#ECEBE6;padding:0 20px\"><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;font-size:17px;font-weight:500;letter-spacing:-0.02em\">How long does a portfolio website take?<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0;padding:0 0 20px;color:#555\">One-page portfolios take about a week. Multi-page portfolios with case studies take two to four weeks.<\u002Fp><\u002Fdetails>\n        <details style=\"border-radius:16px;background:#ECEBE6;padding:0 20px\"><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;font-size:17px;font-weight:500;letter-spacing:-0.02em\">I don't have much work yet. Can I still have one?<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0;padding:0 0 20px;color:#555\">Yes. Students and career changers often start with two or three projects, a strong About section and a downloadable CV. You can add more later.<\u002Fp><\u002Fdetails>\n        <details style=\"border-radius:16px;background:#ECEBE6;padding:0 20px\"><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;font-size:17px;font-weight:500;letter-spacing:-0.02em\">Can you write my bio and project descriptions?<span style=\"flex:none;width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0;padding:0 0 20px;color:#555\">Yes. Copywriting is included in Signature and available as an add-on for the other packages.<\u002Fp><\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Portfolio / CTA\" style=\"border-radius:22px;background:#FFE100;padding:clamp(40px,5vw,72px) clamp(20px,4vw,56px)\">\n    <div style=\"max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px\">\n      <h2 style=\"margin:0;max-width:13em;font-weight:500;font-size:clamp(32px,4.4vw,60px);line-height:1.04;letter-spacing:-0.055em\">Put your name on the internet. <span style=\"color:#6B6200\">Properly.<\u002Fspan><\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <a href=\"Contact.html\" style=\"display:inline-flex;align-items:center;gap:12px;height:50px;padding:0 5px 0 22px;border-radius:999px;background:#111;color:#FFFFFF;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase\" style-hover=\"color:#FFFFFF\">Start my portfolio <span style=\"width:40px;height:40px;border-radius:50%;background:#FFE100;color:#111;display:flex;align-items:center;justify-content:center\">↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <dc-import name=\"SiteFooter\" hint-size=\"100%,560px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { cur: null, who: 'freelancer' };\n  renderVals() {\n    const cur = 'INR';\n    const inr = cur === 'INR', $ = (i, u) => (inr ? i : u);\n    const P = {\n      freelancer: { label: 'Freelancers', goal: 'Win better clients without cold pitching', problem: 'Marketplace profiles look the same as everyone else\\u2019s. Clients want to see how you think, not just a list of skills.', cta: 'Book a discovery call', sections: ['Case studies with results', 'Services and starting rates', 'Client testimonials', 'Calendly booking', 'About and process', 'Contact form'] },\n      job: { label: 'Job seekers', goal: 'Stand out to recruiters and hiring managers', problem: 'A CV gets six seconds. A portfolio link shows real projects and gives you something to talk about in interviews.', cta: 'Download CV', sections: ['Selected projects', 'Downloadable CV', 'Skills and tools', 'Experience timeline', 'LinkedIn and GitHub links', 'Recruiter contact'] },\n      creative: { label: 'Artists & photographers', goal: 'Let the work speak, full screen', problem: 'Instagram crops and compresses your images. Galleries on your own site show them at their best.', cta: 'Enquire about a commission', sections: ['Full-bleed galleries', 'Series and collections', 'Lightbox viewer', 'Print or booking enquiries', 'Exhibitions and press', 'Image protection'] },\n      creator: { label: 'Creators', goal: 'Turn followers into brand deals', problem: 'Brands want audience stats, past campaigns and rates in one place before they reach out.', cta: 'Request media kit', sections: ['Media kit with live stats', 'Past brand campaigns', 'Link hub for all platforms', 'Collaboration form', 'Newsletter signup', 'Shop or merch link'] },\n      founder: { label: 'Founders & coaches', goal: 'Build trust before the first call', problem: 'People buy from people. A personal site with your story, talks and writing does the warming up for you.', cta: 'Book a session', sections: ['Story and credentials', 'Speaking and podcasts', 'Articles and newsletter', 'Programmes or offers', 'Press mentions', 'Booking and payments'] }\n    };\n    const persona = P[this.state.who];\n    const style = (pop) => pop\n      ? { bg: '#111', fg: '#FFFFFF', sub: '#BDBDBD', line: '#333', tick: '#FFE100', btnBg: '#FFE100', btnFg: '#111', btnBorder: '#FFE100', btnBorderCss: '1px solid #FFE100', lineCss: '1px solid #333' }\n      : { bg: '#ECEBE6', fg: '#111', sub: '#666', line: '#DDDCD6', tick: '#0A8BDA', btnBg: 'transparent', btnFg: '#111', btnBorder: '#111', btnBorderCss: '1px solid #111', lineCss: '1px solid #DDDCD6' };\n    const tiers = [\n      { name: 'Essential', forWho: 'One page that says it all', price: $('₹20,000', '$350'), features: ['Single scrolling page', 'Up to 6 work samples', 'Bio, contact and social links', 'Name-based SEO setup', 'Mobile-first, fast'], time: '1 week' },\n      { name: 'Professional', forWho: 'For freelancers and job seekers', price: $('₹45,000', '$750'), popular: true, features: ['Up to 6 pages', 'Up to 12 projects with case-study pages', 'Blog or writing section', 'Booking or CV download', 'Easy editor for new work', '1 month of support'], time: '2–3 weeks' },\n      { name: 'Signature', forWho: 'For creators, coaches and founders', price: $('₹85,000', '$1,400'), features: ['Custom design from scratch', 'Media kit or speaker page', 'Newsletter and payments', 'Bio and project copywriting', 'Video and gallery layouts', '3 months of support'], time: '3–4 weeks' }\n    ].map(t => ({ ...t, cta: 'Choose ' + t.name, popular: !!t.popular, note: inr ? 'one-time · + GST' : 'one-time · USD', ...style(t.popular) }));\n    return {\n      fromLabel: 'From ' + $('₹20,000', '$350'),\n      personas: Object.entries(P).map(([k, v]) => ({ label: v.label, pick: () => this.setState({ who: k }), bg: this.state.who === k ? '#111' : 'transparent', fg: this.state.who === k ? '#FFFFFF' : '#111' })),\n      persona, tiers,\n      curs: [['INR', '₹ INR'], ['USD', '$ USD']].map(([k, l]) => ({ label: l, pick: () => this.setState({ cur: k }), bg: cur === k ? '#111' : 'transparent', fg: cur === k ? '#FFFFFF' : '#111' })),\n      footnote: (inr ? 'Prices exclude 18% GST.' : 'Prices in USD, no Indian tax for overseas clients.') + ' Domain and hosting billed to you directly, from about ' + $('₹3,000', '$40') + ' a year.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
