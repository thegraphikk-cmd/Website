# Publishes scheduled blog posts every morning. Posts live in content/posts/
# with a publish date; scripts/build-blog.mjs turns every post whose date has
# arrived into a page, and rebuilds the blog index, sitemap and home page
# article cards. Vercel (Graphikk team, project "website") is connected to this
# repo and deploys every push to main, so the commit below puts the post live.
name: Publish scheduled blog posts

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM India time, every day
  workflow_dispatch: {}     # "Run workflow" button for a manual publish

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build blog for today
        run: node scripts/build-blog.mjs

      - name: Commit published pages
        run: |
          git config user.name "graphikk-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml index.html web-development-company-chennai.html
          if git diff --cached --quiet; then
            echo "Nothing new to publish today."
          else
            git commit -m "Publish scheduled blog posts ($(TZ=Asia/Kolkata date +%F))"
            git push
          fi
