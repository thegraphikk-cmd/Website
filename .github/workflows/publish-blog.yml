# Publishes scheduled blog posts every morning and deploys the site to Vercel.
# Posts live in content/posts/ with a publish date; scripts/build-blog.mjs turns
# every post whose date has arrived into a page, and rebuilds the blog index,
# sitemap and home page article cards.
name: Publish scheduled blog posts

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM India time, every day
  workflow_dispatch: {}     # "Run workflow" button for a manual publish

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_qyb3U69hgCXhh2C4ti7fImOp
      VERCEL_PROJECT_ID: prj_8SzOlTsNk22bmiAusKTzRZpENomK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build blog for today
        run: node scripts/build-blog.mjs

      - name: Commit published pages
        id: commit
        run: |
          git config user.name "graphikk-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new to publish today."
          else
            git commit -m "Publish scheduled blog posts ($(TZ=Asia/Kolkata date +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx --yes vercel@59.16.0 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
